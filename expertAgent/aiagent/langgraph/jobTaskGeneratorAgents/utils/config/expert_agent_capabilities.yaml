# expertAgent API capabilities
# This file is used for feasibility evaluation in the evaluator_node
# Updated: 2025-12-11
# Issue #270: Added request_schema and response_schema for all major APIs

# ====================
# Utility Direct APIs
# ====================
# These are high-speed, direct APIs without LLM reasoning

utility_apis:
  # Gmail APIs
  - name: "Gmail検索"
    endpoint: "/v1/utility/gmail/search"
    method: "POST"
    description: "Gmail検索（高速・AIフレンドリー）"
    use_cases:
      - "キーワード検索"
      - "日付範囲指定（date_after, date_before）"
      - "未読メール検索（unread_only）"
      - "添付ファイル付きメール検索（has_attachment）"
    performance: "5秒で完了（Utility Agentの36倍高速）"
    request_schema:
      query:
        type: "string"
        description: "Gmail検索クエリ（例: 'is:unread from:sender@example.com'）"
        required: true
      max_results:
        type: "integer"
        description: "取得する最大メール数"
        default: 10
      date_after:
        type: "string"
        description: "この日付以降のメールを検索（YYYY-MM-DD形式）"
      date_before:
        type: "string"
        description: "この日付以前のメールを検索（YYYY-MM-DD形式）"
      unread_only:
        type: "boolean"
        description: "未読メールのみを検索"
        default: false
      has_attachment:
        type: "boolean"
        description: "添付ファイル付きメールのみを検索"
        default: false
    response_schema:
      messages:
        type: "array"
        description: "検索結果のメール一覧"
        items:
          type: "object"
          properties:
            id:
              type: "string"
            threadId:
              type: "string"
            subject:
              type: "string"
            from:
              type: "string"
            date:
              type: "string"
            snippet:
              type: "string"
      result_count:
        type: "integer"
        description: "検索結果の件数"

  - name: "Gmail送信"
    endpoint: "/v1/utility/gmail/send"
    method: "POST"
    description: "メール送信（高速・Direct API）"
    use_cases:
      - "宛先、件名、本文を指定してメール送信"
      - "HTML形式メール対応"
    performance: "3-5秒で完了"
    request_schema:
      to:
        type: "string"
        description: "宛先メールアドレス"
        required: true
      subject:
        type: "string"
        description: "件名"
        required: true
      body:
        type: "string"
        description: "メール本文"
        required: true
      html:
        type: "boolean"
        description: "HTML形式で送信するかどうか"
        default: false
    response_schema:
      result:
        type: "string"
        description: "送信結果メッセージ"
      message_id:
        type: "string"
        description: "送信されたメールのID"

  # Google Search APIs
  - name: "Google検索"
    endpoint: "/v1/utility/google_search"
    method: "POST"
    description: "Web検索（Serper API使用）"
    use_cases:
      - "キーワード検索"
      - "複数クエリ一括検索（queries配列）"
      - "検索結果件数指定（num）"
    implementation: "Serper API経由でGoogle検索"
    request_schema:
      queries:
        type: "array"
        description: "検索クエリのリスト"
        required: true
        items:
          type: "string"
      num:
        type: "integer"
        description: "各クエリの検索結果件数"
        default: 10
    response_schema:
      results:
        type: "array"
        description: "検索結果のリスト"
        items:
          type: "object"
          properties:
            query:
              type: "string"
            organic:
              type: "array"
              items:
                type: "object"
                properties:
                  title:
                    type: "string"
                  link:
                    type: "string"
                  snippet:
                    type: "string"

  - name: "Google検索概要"
    endpoint: "/v1/utility/google_search_overview"
    method: "POST"
    description: "Web検索概要取得（Serper API使用）"
    use_cases:
      - "キーワード検索 + サマリー取得"
      - "複数クエリ一括検索"
    request_schema:
      queries:
        type: "array"
        description: "検索クエリのリスト"
        required: true
        items:
          type: "string"
      num:
        type: "integer"
        description: "各クエリの検索結果件数"
        default: 10
    response_schema:
      overview:
        type: "string"
        description: "検索結果の概要サマリー"
      results:
        type: "array"
        description: "検索結果のリスト"
        items:
          type: "object"

  # Google Drive APIs
  - name: "Google Drive Upload"
    endpoint: "/v1/utility/drive/upload"
    method: "POST"
    description: "ファイルアップロード（ローカルファイル/コンテンツから生成）"
    use_cases:
      - "ローカルファイルのアップロード"
      - "コンテンツからファイル生成＆アップロード"
      - "サブディレクトリ自動作成"
      - "重複ファイル名自動回避"
      - "大ファイル対応（Resumable Upload自動切替）"
    supported_formats:
      - "PDF"
      - "画像（PNG, JPEG, GIF, etc.）"
      - "テキストファイル（TXT, JSON, CSV, etc.）"
      - "音声ファイル（MP3, WAV, etc.）"
    request_schema:
      file_path:
        type: "string"
        description: "ローカルファイルパスまたは作成先パス"
        required: true
      drive_folder_url:
        type: "string"
        description: "Google DriveフォルダURL"
      file_name:
        type: "string"
        description: "保存ファイル名（未指定時は元のファイル名）"
      sub_directory:
        type: "string"
        description: "サブディレクトリパス（例: 'reports/2025'）"
      content:
        type: "string"
        description: "ファイル内容（create_file=true時のみ）"
      file_format:
        type: "string"
        description: "拡張子（create_file=true時のみ、例: 'pdf', 'txt'）"
      create_file:
        type: "boolean"
        description: "ファイル作成モード"
        default: false
    response_schema:
      status:
        type: "string"
        description: "処理ステータス（'success' または 'error'）"
      file_id:
        type: "string"
        description: "Google Drive ファイルID"
      file_name:
        type: "string"
        description: "アップロードされたファイル名"
      web_view_link:
        type: "string"
        description: "ファイル閲覧用URL"
      web_content_link:
        type: "string"
        description: "ファイルダウンロード用URL"
      folder_path:
        type: "string"
        description: "アップロード先フォルダパス"
      file_size_mb:
        type: "number"
        description: "ファイルサイズ（MB）"
      upload_method:
        type: "string"
        description: "アップロードメソッド（'normal' または 'resumable'）"

  - name: "Google Drive Upload from URL"
    endpoint: "/v1/utility/drive/upload_from_url"
    method: "POST"
    description: "URLからファイルダウンロード＆Google Driveアップロード"
    use_cases:
      - "Web上のファイルを直接Google Driveにアップロード"
      - "PDFダウンロード＆アップロード"
    request_schema:
      url:
        type: "string"
        description: "ダウンロード元URL"
        required: true
      drive_folder_url:
        type: "string"
        description: "Google DriveフォルダURL"
      file_name:
        type: "string"
        description: "保存ファイル名"
    response_schema:
      status:
        type: "string"
        description: "処理ステータス"
      file_id:
        type: "string"
        description: "Google Drive ファイルID"
      file_name:
        type: "string"
        description: "アップロードされたファイル名"
      web_view_link:
        type: "string"
        description: "ファイル閲覧用URL"

  # Text-to-Speech APIs
  - name: "Text-to-Speech（Base64）"
    endpoint: "/v1/utility/text_to_speech"
    method: "POST"
    description: "音声合成（Base64エンコードで返却）"
    use_cases:
      - "テキストを音声ファイル（MP3）に変換"
      - "Base64エンコードでJSON形式で返却"
    models:
      - "tts-1（標準品質）"
      - "tts-1-hd（高品質）"
    voices:
      - "alloy"
      - "echo"
      - "fable"
      - "onyx"
      - "nova"
      - "shimmer"
    request_schema:
      text:
        type: "string"
        description: "音声合成するテキスト（最大4096文字）"
        required: true
      model:
        type: "string"
        description: "TTSモデル（tts-1, tts-1-hd）"
        default: "tts-1"
      voice:
        type: "string"
        description: "音声タイプ（alloy, echo, fable, onyx, nova, shimmer）"
        default: "alloy"
    response_schema:
      audio_content:
        type: "string"
        description: "Base64エンコードされた音声データ（MP3形式）"
      format:
        type: "string"
        description: "音声フォーマット（常に 'mp3'）"
      size_bytes:
        type: "integer"
        description: "元のファイルサイズ（バイト単位）"

  - name: "Text-to-Speech + Google Drive"
    endpoint: "/v1/utility/text_to_speech_drive"
    method: "POST"
    description: "音声合成 + Google Driveアップロード"
    use_cases:
      - "テキストを音声ファイル（MP3）に変換"
      - "自動でGoogle Driveにアップロード"
      - "公開リンクを返却"
    request_schema:
      text:
        type: "string"
        description: "音声合成するテキスト（最大4096文字）"
        required: true
      drive_folder_url:
        type: "string"
        description: "Google DriveフォルダURL"
      file_name:
        type: "string"
        description: "保存ファイル名（未指定時は自動生成）"
      sub_directory:
        type: "string"
        description: "サブディレクトリパス（例: 'podcasts/2025'）"
      model:
        type: "string"
        description: "TTSモデル（tts-1, tts-1-hd）"
        default: "tts-1"
      voice:
        type: "string"
        description: "音声タイプ（alloy, echo, fable, onyx, nova, shimmer）"
        default: "alloy"
    response_schema:
      file_id:
        type: "string"
        description: "Google Drive ファイルID"
        required: true
      file_name:
        type: "string"
        description: "アップロードされたファイル名（拡張子.mp3を含む）"
        required: true
      web_view_link:
        type: "string"
        description: "ファイル閲覧用URL（ブラウザで開く用の公開リンク）"
        required: true
      web_content_link:
        type: "string"
        description: "ファイルダウンロード用URL（直接ダウンロード用）"
        required: false
      folder_path:
        type: "string"
        description: "アップロード先フォルダパス（例: 'ルート' または 'podcasts/2025'）"
        required: true
      file_size_mb:
        type: "number"
        description: "ファイルサイズ（メガバイト単位）"
        required: true

  - name: "TTS + Google Drive + Gmail通知"
    endpoint: "/v1/utility/tts_and_upload_drive"
    method: "POST"
    description: "音声合成 + アップロード + メール通知"
    use_cases:
      - "テキストを音声ファイルに変換"
      - "Google Driveにアップロード"
      - "完了通知をメール送信"
    request_schema:
      user_input:
        type: "string"
        description: "音声合成するテキストメッセージ"
        required: true
    response_schema:
      result:
        type: "string"
        description: "アップロード結果メッセージとURL"

# ====================
# AI Agent APIs
# ====================
# These are LangGraph-based AI agents with LLM reasoning

ai_agent_apis:
  # Direct LLM Call
  - name: "Direct LLM"
    endpoint: "/v1/mylllm"
    method: "POST"
    description: "直接LLM呼び出し（システムプロンプト指定可能）"
    use_cases:
      - "カスタムシステムプロンプトでLLM実行"
      - "複数モデル対応（GPT, Gemini, Ollama）"
    models:
      - "gpt-4o-mini（デフォルト）"
      - "gpt-4o"
      - "gemini-1.5-flash"
      - "gemini-1.5-pro"
      - "ollama/llama3"
    request_schema:
      user_input:
        type: "string"
        description: "ユーザー入力メッセージ"
        required: true
      system_prompt:
        type: "string"
        description: "システムプロンプト"
      model:
        type: "string"
        description: "使用するLLMモデル"
        default: "gpt-4o-mini"
    response_schema:
      result:
        type: "string"
        description: "LLMからの応答"

  # LangGraph Sample Agent
  - name: "Sample Agent"
    endpoint: "/v1/aiagent/sample"
    method: "POST"
    description: "LangGraph サンプルエージェント"
    use_cases:
      - "GraphAIワークフロー統合"
      - "force_json=True で JSON保証"
      - "max_retries でリトライ回数指定"
    request_schema:
      user_input:
        type: "string"
        description: "ユーザー入力"
        required: true
      force_json:
        type: "boolean"
        description: "JSON形式での出力を強制"
        default: false
      max_retries:
        type: "integer"
        description: "最大リトライ回数"
        default: 3
    response_schema:
      result:
        type: "string"
        description: "エージェントからの応答"

  # Utility AI Agents (endpoint: /v1/aiagent/utility/{agent_name})
  - name: "JSON Output Agent"
    endpoint: "/v1/aiagent/utility/jsonoutput"
    method: "POST"
    description: "構造化JSON出力専用エージェント"
    use_cases:
      - "自然言語→JSON変換"
      - "常にJSON形式で返却"
      - "force_json不要（常にJSON）"
    request_schema:
      user_input:
        type: "string"
        description: "ユーザー入力（自然言語またはJSON変換対象テキスト）"
        required: true
      system_prompt:
        type: "string"
        description: "システムプロンプト（JSON構造を指定）"
      model:
        type: "string"
        description: "使用するLLMモデル"
        default: "gemini-2.5-flash"
    response_schema:
      result:
        type: "object"
        description: "JSON形式の構造化出力"
        properties: {}

  - name: "Explorer Agent"
    endpoint: "/v1/aiagent/utility/explorer"
    method: "POST"
    description: "ファイルシステム探索エージェント"
    use_cases:
      - "ディレクトリ構造の取得"
      - "ファイル検索"
      - "ファイルリスト作成"
    mcp_tools:
      - "read_file"
      - "write_file"
      - "create_directory"
      - "list_directory"
      - "directory_tree"
    request_schema:
      user_input:
        type: "string"
        description: "探索指示（例: '/tmp配下のファイル一覧を取得'）"
        required: true
    response_schema:
      result:
        type: "string"
        description: "探索結果"

  - name: "Action Agent"
    endpoint: "/v1/aiagent/utility/action"
    method: "POST"
    description: "汎用アクション実行エージェント"
    use_cases:
      - "複数API組み合わせ"
      - "複雑なタスク実行"
    mcp_tools:
      - "read_file"
      - "write_file"
      - "create_directory"
      - "list_directory"
    request_schema:
      user_input:
        type: "string"
        description: "実行指示"
        required: true
    response_schema:
      result:
        type: "string"
        description: "実行結果"

  - name: "Playwright Agent"
    endpoint: "/v1/aiagent/utility/playwright"
    method: "POST"
    description: "ブラウザ自動化エージェント（MCP Playwright使用）"
    use_cases:
      - "Webスクレイピング"
      - "フォーム操作"
      - "ブラウザ自動化"
      - "スクリーンショット取得"
    mcp_tools:
      - "browser_navigate"
      - "browser_snapshot"
      - "browser_click"
      - "browser_type"
      - "browser_evaluate"
      - "browser_take_screenshot"
    limitations:
      - "不安定な動作の可能性あり"
      - "複雑なWebページでは失敗する可能性"
      - "推奨代替: Google検索API + fetchAgent"
    request_schema:
      user_input:
        type: "string"
        description: "ブラウザ操作指示"
        required: true
    response_schema:
      result:
        type: "string"
        description: "操作結果"

  - name: "Wikipedia Agent"
    endpoint: "/v1/aiagent/utility/wikipedia"
    method: "POST"
    description: "Wikipedia検索エージェント"
    use_cases:
      - "Wikipedia記事検索"
      - "多言語対応（language指定）"
    parameters:
      - "language: 言語コード（ja, en, etc.）デフォルト: ja"
    request_schema:
      user_input:
        type: "string"
        description: "検索クエリ"
        required: true
      language:
        type: "string"
        description: "言語コード（ja, en, etc.）"
        default: "ja"
    response_schema:
      result:
        type: "string"
        description: "Wikipedia記事の内容"

  - name: "File Reader Agent"
    endpoint: "/v1/aiagent/utility/file_reader"
    method: "POST"
    description: "ファイル読み取りエージェント"
    use_cases:
      - "テキストファイル読み取り"
      - "PDFファイル読み取り"
      - "画像の読み取り・OCR"
      - "複数ファイルの一括処理"
    mcp_tools:
      - "read_file"
      - "list_directory"
    request_schema:
      user_input:
        type: "string"
        description: "読み取り指示（ファイルパスや処理内容）"
        required: true
    response_schema:
      result:
        type: "string"
        description: "ファイル内容または処理結果"

# ====================
# MCP Servers (External)
# ====================
# MCP servers are external tools integrated via Model Context Protocol

mcp_servers:
  - name: "Playwright MCP"
    description: "Chromium headless browser automation"
    tools:
      - browser_navigate
      - browser_snapshot
      - browser_click
      - browser_type
      - browser_evaluate
      - browser_take_screenshot
      - browser_close
      - browser_resize
      - browser_console_messages
      - browser_handle_dialog
      - browser_file_upload
      - browser_fill_form
      - browser_press_key
      - browser_select_option
      - browser_tabs
      - browser_wait_for
      - browser_drag
      - browser_hover
      - browser_network_requests
      - browser_navigate_back

  - name: "Filesystem MCP"
    description: "File and directory operations"
    tools:
      - read_file
      - write_file
      - create_directory
      - list_directory
      - directory_tree
      - move_file
      - search_files
      - get_file_info
      - list_allowed_directories

# ====================
# Known Limitations
# ====================
# APIs that do NOT exist or have limitations

missing_capabilities:
  - name: "Google Drive Folder Create"
    description: "Google Driveのフォルダ作成機能"
    status: "不存在"
    workaround: "手動でフォルダを作成するか、事前に作成済みフォルダIDを指定"

  - name: "MP3 Encoder"
    description: "RAW/WAV音声データをMP3に変換"
    status: "不存在"
    workaround: "TTSは直接MP3を生成するため、通常は不要。WAV/RAWが必要な場合はユーザー側で変換"

  - name: "PDF Text Extraction"
    description: "PDFからテキスト抽出（専用API）"
    status: "File Reader Agentで対応可能"
    workaround: "File Reader Agentを使用"

# ====================
# Best Practices
# ====================
# Recommended usage patterns

best_practices:
  - pattern: "Web scraping"
    recommendation: "Playwright Agentは不安定なため、Google検索API + fetchAgent の組み合わせを推奨"

  - pattern: "File upload"
    recommendation: "大ファイル（>5MB）は自動でResumable Upload に切り替わる"

  - pattern: "Email processing"
    recommendation: "Gmail検索APIは高速（5秒）、Utility Agentは遅い（25-180秒）"

  - pattern: "JSON output guarantee"
    recommendation: "force_json=True を使用するか、JSON Output Agentを使用"

  - pattern: "TTS + storage"
    recommendation: "text_to_speech_drive を使用すると、Google Driveアップロード + リンク返却が一度に可能"
