# Few-shot example: API Call pattern
# Generic API call workflow - URL must be taken from API Mappings section
# Issue #342 V2: URLs are now placeholders to prevent LLM from copying
name: "api_call_pattern"
description: "Generic API call pattern - IMPORTANT: Use URL from API Mappings section"
applicable_apis:
  - "gmail_send"
  - "drive_upload"
  - "text_to_speech"
  - "text_to_speech_drive"

task_example:
  name: "Generic API Call Task"
  description: "Call an API endpoint with specified parameters"
  input_schema:
    type: object
    properties:
      param1:
        type: string
        description: "First parameter"
      param2:
        type: string
        description: "Second parameter"
    required:
      - param1
  output_schema:
    type: object
    properties:
      result:
        type: string
        description: "API call result"
      status:
        type: string
        description: "Operation status"

workflow_yaml: |
  version: "0.5"
  nodes:
    source: {}

    # NOTE: Replace <API_URL_FROM_MAPPINGS> with the actual URL
    # from the 'API Endpoint Mappings' section above
    call_api:
      agent: fetchAgent
      inputs:
        url: <API_URL_FROM_MAPPINGS>
        method: POST
        body:
          param1: :source.user_input.param1
          param2: :source.user_input.param2
      console:
        after: true

    format_response:
      agent: copyAgent
      inputs:
        result: :call_api.result
        status: :call_api.status
      params:
        namedKey: result
      isResult: true
