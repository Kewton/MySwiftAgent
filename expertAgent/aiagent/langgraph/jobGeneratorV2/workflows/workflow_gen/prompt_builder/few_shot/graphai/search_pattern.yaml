# Few-shot example: Search pattern
# Google Search -> Format Results workflow
# NOTE: This URL is ONLY for google_search API. For other APIs, use API Mappings section.
name: "search_pattern"
description: "Search API pattern - URL is google_search ONLY. For other APIs, use API Mappings."
applicable_apis:
  - "google_search"
  - "gmail_search"
  - "google_search_overview"

task_example:
  name: "Keyword Search Task"
  description: "Execute Google search with specified keyword and format results"
  input_schema:
    type: object
    properties:
      keyword:
        type: string
        description: "Search keyword"
    required:
      - keyword
  output_schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            knowledge:
              type: string

workflow_yaml: |
  version: "0.5"
  nodes:
    source: {}

    search_api:
      agent: fetchAgent
      inputs:
        url: ${EXPERTAGENT_BASE_URL}/aiagent-api/v1/utility/google_search
        method: POST
        body:
          queries:
            - :source.user_input.keyword
          num: 3
      timeout: 180
      console:
        after: true

    format_results:
      agent: stringTemplateAgent
      inputs:
        results: :search_api.search_results
      params:
        template: |
          Search Results:
          ${results}
      isResult: true
