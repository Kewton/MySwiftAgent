# Search and Summarize Workflow Pattern
# Issue #342 Task 3.2: Standard pattern template
#
# This pattern searches Google and summarizes the results using LLM.
# Steps: search -> stringify -> build_prompt -> llm

version: "0.5"

nodes:
  source: {}

  # Step 1: Search Google
  fetch_search_results:
    agent: fetchAgent
    inputs:
      url: http://localhost:8004/aiagent-api/v1/utility/google_search
      method: POST
      body:
        queries: ":source.user_input.queries"
        num: 3
    timeout: 30000

  # Step 2: Convert results to JSON string (for stringTemplateAgent)
  stringify_results:
    agent: fetchAgent
    inputs:
      url: http://localhost:8004/aiagent-api/v1/utility/json_stringify
      method: POST
      body:
        data: ":fetch_search_results.search_results"
    timeout: 30000

  # Step 3: Build prompt with search results
  build_prompt:
    agent: stringTemplateAgent
    inputs:
      results: ":stringify_results.json_string"
    params:
      template: |
        以下の検索結果を日本語で要約してください。
        重要なポイントを箇条書きでまとめてください。

        検索結果:
        ${results}

  # Step 4: Call LLM to generate summary
  call_llm:
    agent: fetchAgent
    inputs:
      url: http://localhost:8004/aiagent-api/v1/aiagent/utility/jsonoutput
      method: POST
      body:
        user_input: ":build_prompt"
        model_name: gemini-2.0-flash
        force_json: true
    timeout: 120000
    isResult: true
