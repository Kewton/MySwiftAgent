# MyVault Secret Definitions for expertAgent
api_keys:
  type: string
  required: true
  description: "API keys for AI services"
  keys:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - GOOGLE_API_KEY
    - GROQ_API_KEY
    - SERPER_API_KEY
    - LANGFUSE_PUBLIC_KEY
    - LANGFUSE_SECRET_KEY

service_config:
  type: string
  required: false
  description: "Service-specific configuration"
  keys:
    - MAIL_TO
    - SPREADSHEET_ID
    - OLLAMA_URL
    - MLX_LLM_SERVER_URL
    - LANGFUSE_HOST
    - VALKEY_HOST
    - VALKEY_PORT
    - VALKEY_DB
    - VALKEY_TTL
