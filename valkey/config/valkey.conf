# Valkey Configuration for MySwiftAgent
# Issue #169: Valkey persistence infrastructure

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename valkey.rdb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Snapshotting
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Append Only File
appendonly no
