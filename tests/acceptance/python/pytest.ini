[pytest]
# Python acceptance test configuration
# These tests are NOT run in CI - they require API keys and running services

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Default markers for acceptance tests
markers =
    platform: Platform layer acceptance tests
    agent: Agent layer acceptance tests
    frontend: Frontend layer acceptance tests
    e2e: End-to-end acceptance tests
    requires_api_key: Tests requiring external API keys
    slow: Slow-running tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Minimum pytest version
minversion = 7.0

# Verbose output by default
addopts = -v --tb=short

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
