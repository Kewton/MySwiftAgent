name: CI - Develop Integration

on:
  push:
    branches: [develop]
    paths:
      - 'myscheduler/**'
      - 'jobqueue/**'
      - 'expertAgent/**'
      - 'commonUI/**'
      - 'valkey/**'
      - '.github/workflows/**'
      # docs changes are handled by separate docs workflow
      - '!docs/**'

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      myscheduler: ${{ steps.changes.outputs.myscheduler }}
      jobqueue: ${{ steps.changes.outputs.jobqueue }}
      expertAgent: ${{ steps.changes.outputs.expertAgent }}
      commonUI: ${{ steps.changes.outputs.commonUI }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get current and previous commit

      - name: Detect changes
        id: changes
        run: |
          echo "Detecting changes in directories..."

          # Check if files changed in each project directory
          if git diff --name-only HEAD~1 HEAD | grep -q "^myscheduler/"; then
            echo "myscheduler=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in myscheduler"
          else
            echo "myscheduler=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^jobqueue/"; then
            echo "jobqueue=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in jobqueue"
          else
            echo "jobqueue=false" >> $GITHUB_OUTPUT
          fi

          # expertAgent tests also run when valkey/ changes (shared infrastructure)
          if git diff --name-only HEAD~1 HEAD | grep -Eq "^(expertAgent/|valkey/)"; then
            echo "expertAgent=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in expertAgent or valkey"
          else
            echo "expertAgent=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^commonUI/"; then
            echo "commonUI=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in commonUI"
          else
            echo "commonUI=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.myscheduler == 'true' || needs.detect-changes.outputs.jobqueue == 'true' || needs.detect-changes.outputs.expertAgent == 'true' || needs.detect-changes.outputs.commonUI == 'true'

    services:
      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ['3.12']
        project:
          - ${{ needs.detect-changes.outputs.myscheduler == 'true' && 'myscheduler' || '' }}
          - ${{ needs.detect-changes.outputs.jobqueue == 'true' && 'jobqueue' || '' }}
          - ${{ needs.detect-changes.outputs.expertAgent == 'true' && 'expertAgent' || '' }}
          - ${{ needs.detect-changes.outputs.commonUI == 'true' && 'commonUI' || '' }}
        exclude:
          - project: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: uv sync --extra dev

      - name: Run linting
        working-directory: ./${{ matrix.project }}
        run: uv run ruff check .

      - name: Run type checking
        working-directory: ./${{ matrix.project }}
        run: |
          if [[ "${{ matrix.project }}" == "commonUI" ]]; then
            echo "Running mypy for commonUI (Streamlit app)"
            uv run mypy .
          else
            echo "Running mypy for FastAPI project"
            uv run mypy app/
          fi

      - name: Run tests with coverage
        working-directory: ./${{ matrix.project }}
        run: |
          if [[ "${{ matrix.project }}" == "commonUI" ]]; then
            echo "Running tests for commonUI (Streamlit app)"
            uv run pytest tests/ -v --cov=components --cov=core --cov-report=xml --cov-report=term
          else
            echo "Running tests for FastAPI project"
            uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./${{ matrix.project }}/coverage.xml
          directory: ./${{ matrix.project }}
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.myscheduler == 'true' || needs.detect-changes.outputs.jobqueue == 'true' || needs.detect-changes.outputs.expertAgent == 'true' || needs.detect-changes.outputs.commonUI == 'true'
    strategy:
      matrix:
        project:
          - ${{ needs.detect-changes.outputs.myscheduler == 'true' && 'myscheduler' || '' }}
          - ${{ needs.detect-changes.outputs.jobqueue == 'true' && 'jobqueue' || '' }}
          - ${{ needs.detect-changes.outputs.expertAgent == 'true' && 'expertAgent' || '' }}
          - ${{ needs.detect-changes.outputs.commonUI == 'true' && 'commonUI' || '' }}
        exclude:
          - project: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: uv sync --extra dev

      - name: Run integration tests
        working-directory: ./${{ matrix.project }}
        run: |
          echo "🧪 Running integration tests for ${{ matrix.project }}"
          if [ ! -d "tests/integration" ]; then
            echo "⚠️ tests/integration/ not found, skipping integration tests"
            exit 0
          fi
          if [[ "${{ matrix.project }}" == "commonUI" ]]; then
            # Integration tests for Streamlit app
            # Coverage measured for components and core modules
            uv run pytest tests/integration/ -v --cov=components --cov=core --cov-report=xml --cov-report=term --cov-fail-under=50
          else
            # Integration tests focus on API endpoints and integration flows
            # Coverage measured only for API layer (app/) as core logic is covered by unit tests
            # Lower coverage threshold (50%) as detailed unit tests cover internal logic (90%+)
            uv run pytest tests/integration/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=50
          fi

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, integration-test, detect-changes]
    if: needs.detect-changes.outputs.myscheduler == 'true' || needs.detect-changes.outputs.jobqueue == 'true' || needs.detect-changes.outputs.expertAgent == 'true' || needs.detect-changes.outputs.commonUI == 'true'
    strategy:
      matrix:
        project:
          - ${{ needs.detect-changes.outputs.myscheduler == 'true' && 'myscheduler' || '' }}
          - ${{ needs.detect-changes.outputs.jobqueue == 'true' && 'jobqueue' || '' }}
          - ${{ needs.detect-changes.outputs.expertAgent == 'true' && 'expertAgent' || '' }}
          - ${{ needs.detect-changes.outputs.commonUI == 'true' && 'commonUI' || '' }}
        exclude:
          - project: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build package
        working-directory: ./${{ matrix.project }}
        run: uv build

      - name: Build Docker image
        working-directory: ./${{ matrix.project }}
        run: |
          PROJECT_LOWER=$(echo "${{ matrix.project }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${PROJECT_LOWER}:test .

      - name: Test Docker image
        run: |
          PROJECT_LOWER=$(echo "${{ matrix.project }}" | tr '[:upper:]' '[:lower:]')

          # Streamlit (commonUI) uses port 8501, FastAPI projects use port 8000
          if [[ "${{ matrix.project }}" == "commonUI" ]]; then
            docker run --rm -d --name ${PROJECT_LOWER}-test -p 8501:8501 ${PROJECT_LOWER}:test
            sleep 15  # Streamlit needs more startup time

            # Streamlit health check
            echo "🔍 Testing Streamlit health endpoint..."
            curl -f http://localhost:8501/_stcore/health || exit 1

            # Streamlit home page
            echo "🔍 Testing Streamlit home page..."
            curl -f http://localhost:8501/ || exit 1
          else
            docker run --rm -d --name ${PROJECT_LOWER}-test -p 8000:8000 ${PROJECT_LOWER}:test
            sleep 10

            # FastAPI health check
            echo "🔍 Testing health endpoint..."
            curl -f http://localhost:8000/health || exit 1

            # API基本機能テスト（プロジェクトごとにカスタマイズ）
            echo "🔍 Testing API endpoints..."
            if [[ "${{ matrix.project }}" == "expertAgent" ]]; then
              curl -f http://localhost:8000/ || exit 1
              curl -f http://localhost:8000/aiagent-api/v1/ || exit 1
            elif [[ "${{ matrix.project }}" == "myscheduler" ]]; then
              curl -f http://localhost:8000/api/v1/jobs/ || exit 1
            elif [[ "${{ matrix.project }}" == "jobqueue" ]]; then
              curl -f http://localhost:8000/api/v1/jobs/ || exit 1
            fi
          fi

          docker stop ${PROJECT_LOWER}-test

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.myscheduler == 'true' || needs.detect-changes.outputs.jobqueue == 'true' || needs.detect-changes.outputs.expertAgent == 'true' || needs.detect-changes.outputs.commonUI == 'true'
    strategy:
      matrix:
        project:
          - ${{ needs.detect-changes.outputs.myscheduler == 'true' && 'myscheduler' || '' }}
          - ${{ needs.detect-changes.outputs.jobqueue == 'true' && 'jobqueue' || '' }}
          - ${{ needs.detect-changes.outputs.expertAgent == 'true' && 'expertAgent' || '' }}
          - ${{ needs.detect-changes.outputs.commonUI == 'true' && 'commonUI' || '' }}
        exclude:
          - project: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: uv sync --extra dev

      - name: Code complexity analysis
        working-directory: ./${{ matrix.project }}
        run: |
          echo "📊 Analyzing code complexity for ${{ matrix.project }}"

      - name: Security analysis
        working-directory: ./${{ matrix.project }}
        run: |
          echo "🔒 Running security analysis for ${{ matrix.project }}"
          # Use pyproject.toml configuration which already ignores test-related security rules
          uv run ruff check .

      - name: Import analysis
        working-directory: ./${{ matrix.project }}
        run: |
          echo "📦 Analyzing imports for ${{ matrix.project }}"

  notify:
    name: Quality Check Results
    runs-on: ubuntu-latest
    needs: [build-check, code-quality]
    if: always()

    steps:
      - name: Success notification
        if: needs.build-check.result == 'success' && needs.code-quality.result == 'success'
        run: |
          echo "✅ All quality checks passed for develop branch"

      - name: Failure notification
        if: needs.build-check.result == 'failure' || needs.code-quality.result == 'failure'
        run: |
          echo "❌ Quality checks failed - review required"