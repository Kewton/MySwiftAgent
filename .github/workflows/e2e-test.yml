name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'mySwiftAgentCore/**'
      - '.github/workflows/e2e-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mySwiftAgentCore/**'
      - '.github/workflows/e2e-test.yml'

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mySwiftAgentCore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mySwiftAgentCore/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          MSW_ENABLED: true
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: mySwiftAgentCore/test-results/
          retention-days: 7

  e2e-test-report:
    runs-on: ubuntu-latest
    needs: e2e-test
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
        continue-on-error: true

      - name: Create test summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.e2e-test.result }}" == "success" ]; then
            echo ":white_check_mark: All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Some E2E tests failed" >> $GITHUB_STEP_SUMMARY
          fi
