[project]
name = "myswiftagent-cli"
version = "0.1.0"
description = "MySwiftAgent CLI Tools"
authors = [
    {name = "MySwiftAgent Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.5",
    "mypy>=1.14.0",
    "types-psutil>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
msa-status = "cli.status_dashboard:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --no-cov"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: mark test as integration test",
    "e2e: mark test as end-to-end test",
    "llm_required: mark test as requiring LLM API access",
    "production: mark test as production-critical",
    "critical: mark test as critical path",
    "slow: mark test as slow-running",
]

[tool.coverage.run]
source = ["cli"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.7",
    "httpx>=0.27.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
]
