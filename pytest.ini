[pytest]
# Pytest設定ファイル - Python プロジェクト用

# テストディスカバリー設定
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# カバレッジ設定
addopts =
    --cov=app
    --cov=src
    --cov-report=html:test-results/coverage/python
    --cov-report=term-missing:skip-covered
    --cov-report=json:test-results/coverage/coverage-python.json
    --cov-report=lcov:test-results/coverage/lcov-python.info
    --cov-fail-under=90
    --strict-markers
    --verbose
    -ra

# マーカー定義
markers =
    unit: 単体テスト
    integration: 結合テスト
    e2e: E2Eテスト
    slow: 実行時間が長いテスト
    acceptance: 受入テスト
    tdd: TDD実装中のテスト

# カバレッジ除外設定
[coverage:run]
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */config/*
    */.venv/*
    */venv/*

[coverage:report]
# カバレッジレポート設定
precision = 2
show_missing = True
skip_covered = False
fail_under = 90

# カバレッジ判定基準
[coverage:html]
directory = test-results/coverage/python
title = Python Coverage Report

[coverage:json]
output = test-results/coverage/coverage-python.json

# ログ設定
[pytest.logging]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# テスト結果出力
[pytest.reporting]
junit_family = xunit2
junit_suite_name = MySwiftAgent Python Tests
junit_logging = all
junit_log_passing_tests = true