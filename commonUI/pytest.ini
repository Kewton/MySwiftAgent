[pytest]
# Pytest設定ファイル - commonUI Streamlit アプリ用
# UIコンポーネント中心のため、カバレッジ要件は緩和（50%）

# テストディスカバリー設定
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to exclude from test discovery
norecursedirs =
    .git
    __pycache__
    .pytest_cache
    node_modules
    .venv
    venv

# カバレッジ設定（ルートのpytest.iniを上書き）
# StreamlitアプリはUI中心のため、カバレッジ要件を緩和
# UIコンポーネント(job_master_form, task_selector等)はStreamlit依存のため単体テスト困難
# 現状42%、閾値40%で許容
addopts =
    --cov=components
    --cov=core
    --cov-report=term-missing:skip-covered
    --cov-fail-under=40
    --strict-markers
    --verbose
    -ra

# マーカー定義
markers =
    unit: 単体テスト
    integration: 結合テスト
    slow: 実行時間が長いテスト
