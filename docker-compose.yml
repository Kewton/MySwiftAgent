# Docker Compose configuration for MySwiftAgent services
# This is a unified compose file that includes all layer-specific compose files.
#
# Layer Structure:
#   - Platform: Core infrastructure (valkey, jobqueue, myscheduler, myvault, langfuse)
#   - Agent: AI services (expertagent, graphaiserver)
#   - Frontend: UI applications (commonui, myagentdesk)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose config         # Validate configuration
#
# For layer-specific operations, use the Makefile:
#   make dev-platform             # Start Platform layer only
#   make dev-agent                # Start Agent layer only
#   make dev-frontend             # Start Frontend layer only
#   make dev-all                  # Start all layers in order
#
# Prerequisites:
#   1. Copy .env.example to .env and configure
#   2. Create network: docker network create myswiftagent-network
#
# See docs/arch/service-dependencies.md for service dependency details.

include:
  - path: docker-compose.platform.yml
    project_directory: .
  - path: docker-compose.agent.yml
    project_directory: .
  - path: docker-compose.frontend.yml
    project_directory: .

# Network is defined in the layer files as external
# It must be created first: docker network create myswiftagent-network
