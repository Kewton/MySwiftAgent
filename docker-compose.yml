# Docker Compose configuration for MySwiftAgent services
# Docker Compose uses .env.docker for environment variables
# See docs/design/environment-variables.md for details

services:
  # Valkey Service - In-memory data store for conversation persistence
  valkey:
    image: valkey/valkey:latest
    container_name: myswiftagent-valkey
    ports:
      - "6381:6379"  # Host port 6381 to avoid conflict with langfuse-redis (6380)
    volumes:
      - ./valkey/data:/data
      - ./valkey/config/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # JobQueue Service - Job queue management API
  jobqueue:
    env_file:
      - .env.docker
    image: myswiftagent-jobqueue:${JOBQUEUE_VERSION:-0.1.0}
    build:
      context: ./jobqueue
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-jobqueue:${JOBQUEUE_VERSION:-0.1.0}"
    container_name: myswiftagent-jobqueue
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - JOBQUEUE_DB_URL=sqlite+aiosqlite:///./data/jobqueue.db
      - TZ=Asia/Tokyo
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./docker-compose-data/jobqueue:/app/data
      - ./docker-compose-data/jobqueue/logs:/app/logs
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # MyScheduler Service - Job scheduling service
  myscheduler:
    env_file:
      - .env.docker
    image: myswiftagent-myscheduler:${MYSCHEDULER_VERSION:-0.2.0}
    build:
      context: ./myscheduler
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-myscheduler:${MYSCHEDULER_VERSION:-0.2.0}"
    container_name: myswiftagent-myscheduler
    ports:
      - "8002:8000"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      - JOBQUEUE_API_URL=http://jobqueue:8000
      - DATABASE_URL=sqlite:///./data/jobs.db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./docker-compose-data/myscheduler:/app/data
      - ./docker-compose-data/myscheduler/logs:/app/logs
    depends_on:
      jobqueue:
        condition: service_healthy
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # MyVault Service - Secrets management service
  myvault:
    env_file:
      - .env.docker
    image: myswiftagent-myvault:${MYVAULT_VERSION:-0.1.0}
    build:
      context: ./myVault
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-myvault:${MYVAULT_VERSION:-0.1.0}"
    container_name: myswiftagent-myvault
    ports:
      - "8003:8000"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      # Database configuration
      - DATABASE_URL=sqlite:///./data/myvault.db
      # Master encryption key (REQUIRED - set in .env)
      - MSA_MASTER_KEY=${MSA_MASTER_KEY}
      # Service authentication tokens
      - TOKEN_expertagent=${MYVAULT_TOKEN_EXPERTAGENT}
      - TOKEN_myscheduler=${MYVAULT_TOKEN_MYSCHEDULER}
      - TOKEN_jobqueue=${MYVAULT_TOKEN_JOBQUEUE}
      - TOKEN_commonui=${MYVAULT_TOKEN_COMMONUI}
      # Logging
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./docker-compose-data/myvault:/app/data
      - ./docker-compose-data/myvault/logs:/app/logs
      - ./myVault/config.yaml:/app/config.yaml:ro
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ExpertAgent Service - AI agent service
  expertagent:
    env_file:
      - .env.docker
    image: myswiftagent-expertagent:${EXPERTAGENT_VERSION:-0.1.2}
    build:
      context: ./expertAgent
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-expertagent:${EXPERTAGENT_VERSION:-0.1.2}"
    container_name: myswiftagent-expertagent
    ports:
      - "8004:8000"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      # Admin authentication
      - ADMIN_TOKEN=${EXPERTAGENT_ADMIN_TOKEN}
      # Valkey Configuration (Conversation persistence)
      - VALKEY_URL=redis://valkey:6379
      - CONVERSATION_STORE_TYPE=${CONVERSATION_STORE_TYPE:-valkey}
      # MyVault Configuration (Priority for secrets management)
      - MYVAULT_ENABLED=${MYVAULT_ENABLED:-true}
      - MYVAULT_BASE_URL=http://myvault:8000
      - MYVAULT_SERVICE_NAME=expertagent
      - MYVAULT_SERVICE_TOKEN=${MYVAULT_TOKEN_EXPERTAGENT}
      - MYVAULT_DEFAULT_PROJECT=${MYVAULT_DEFAULT_PROJECT:-expertagent}
      - GOOGLE_APIS_DEFAULT_PROJECT=${GOOGLE_APIS_DEFAULT_PROJECT:-default_project}
      # API Keys are managed in MyVault (not passed as env vars)
      # Google APIs
      - GOOGLE_APIS_TOKEN_PATH=/app/token/token.json
      - GOOGLE_APIS_CREDENTIALS_PATH=/app/token/credentials.json
      # Mail Configuration (optional)
      - MAIL_TO=${MAIL_TO:-}
      # Model Configuration
      - GRAPH_AGENT_MODEL=${GRAPH_AGENT_MODEL:-gemini-2.5-flash}
      - PODCAST_SCRIPT_DEFAULT_MODEL=${PODCAST_SCRIPT_DEFAULT_MODEL:-gpt-4o-mini}
      - EXTRACT_KNOWLEDGE_MODEL=${EXTRACT_KNOWLEDGE_MODEL:-gemma3:27b-it-q8_0}
      # Ollama Configuration (Docker uses host.docker.internal to access host services)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_DEF_SMALL_MODEL=${OLLAMA_DEF_SMALL_MODEL:-gemma3:27b-it-q8_0}
      # Other Services (optional)
      - SPREADSHEET_ID=${SPREADSHEET_ID:-}
      - MLX_LLM_SERVER_URL=http://host.docker.internal:8080
      # Logging
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Node.js module path for Playwright
      - NODE_PATH=/usr/lib/node_modules
    volumes:
      - ./docker-compose-data/expertagent/token:/app/token
      - ./docker-compose-data/expertagent/logs:/app/logs
    # Playwright browser support: Chromium needs sufficient shared memory
    shm_size: 2gb
    # Security options for Chromium browser (disable seccomp for sandbox)
    security_opt:
      - seccomp=unconfined
    # Add SYS_ADMIN capability for Chromium sandboxing
    cap_add:
      - SYS_ADMIN
    depends_on:
      myvault:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # GraphAiServer Service - Graph AI workflow service
  graphaiserver:
    env_file:
      - .env.docker
    image: myswiftagent-graphaiserver:${GRAPHAISERVER_VERSION:-0.1.0}
    build:
      context: ./graphAiServer
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-graphaiserver:${GRAPHAISERVER_VERSION:-0.1.0}"
    container_name: myswiftagent-graphaiserver
    ports:
      - "8005:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - TZ=Asia/Tokyo
      - MODEL_BASE_PATH=/app/config/graphai/
      # Admin authentication
      - ADMIN_TOKEN=${GRAPHAISERVER_ADMIN_TOKEN}
      # GraphAI workflow service URLs (container-to-container communication)
      - EXPERTAGENT_BASE_URL=http://expertagent:8000
      - GRAPHAISERVER_BASE_URL=http://graphaiserver:8000
      - MYVAULT_BASE_URL=http://myvault:8000
      - JOBQUEUE_BASE_URL=http://jobqueue:8000
      - MYSCHEDULER_BASE_URL=http://myscheduler:8000
      # API Keys are managed in MyVault (not passed as env vars)
      # Logging
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./docker-compose-data/graphaiserver/config:/app/config
      - ./docker-compose-data/graphaiserver/logs:/app/logs
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # CommonUI Service - Web interface (Streamlit)
  commonui:
    env_file:
      - .env.docker
    image: myswiftagent-commonui:${COMMONUI_VERSION:-0.2.0}
    build:
      context: ./commonUI
      dockerfile: Dockerfile
      tags:
        - "myswiftagent-commonui:${COMMONUI_VERSION:-0.2.0}"
    container_name: myswiftagent-commonui
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Tokyo
      # Service API URLs (using correct environment variable names for config.py)
      - JOBQUEUE_BASE_URL=http://jobqueue:8000
      - MYSCHEDULER_BASE_URL=http://myscheduler:8000
      - MYVAULT_BASE_URL=http://myvault:8000
      - EXPERTAGENT_BASE_URL=http://expertagent:8000
      - GRAPHAISERVER_BASE_URL=http://graphaiserver:8000
      # Service authentication tokens
      - JOBQUEUE_API_TOKEN=${JOBQUEUE_API_TOKEN:-}
      - MYSCHEDULER_API_TOKEN=${MYSCHEDULER_API_TOKEN:-}
      - MYVAULT_SERVICE_NAME=commonui
      - MYVAULT_SERVICE_TOKEN=${MYVAULT_TOKEN_COMMONUI}
      - EXPERTAGENT_ADMIN_TOKEN=${EXPERTAGENT_ADMIN_TOKEN:-}
      - GRAPHAISERVER_ADMIN_TOKEN=${GRAPHAISERVER_ADMIN_TOKEN:-}
      # Logging
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./docker-compose-data/commonUI:/app/data
      - ./docker-compose-data/commonUI/logs:/app/logs
    depends_on:
      jobqueue:
        condition: service_healthy
      myscheduler:
        condition: service_healthy
      myvault:
        condition: service_healthy
      expertagent:
        condition: service_healthy
      graphaiserver:
        condition: service_healthy
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ============================================================================
  # Langfuse Services - LLM Observability Platform
  # ============================================================================

  langfuse-db:
    image: postgres:15-alpine
    container_name: myswiftagent-langfuse-db
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./docker-compose-data/langfuse/db:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Port 5433 to avoid conflict with expertAgent PostgreSQL
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: myswiftagent-langfuse-clickhouse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - ./docker-compose-data/langfuse/clickhouse:/var/lib/clickhouse
      - ./docker-compose-data/langfuse/clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      - myswiftagent
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  langfuse-redis:
    image: redis:7-alpine
    container_name: myswiftagent-langfuse-redis
    command: >
      --requirepass ${REDIS_AUTH:-myredissecret}
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio:latest
    container_name: myswiftagent-langfuse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./docker-compose-data/langfuse/minio:/data
    ports:
      - "9002:9000"  # MinIO API (Port 9002 to avoid conflict with ClickHouse)
      - "9001:9001"  # MinIO Console
    networks:
      - myswiftagent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: myswiftagent-langfuse-worker
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-env
      # Database
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}

      # Core Configuration
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}

      # ClickHouse Configuration
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://langfuse-clickhouse:9000}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://langfuse-clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-langfuse-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_AUTH: ${REDIS_AUTH:-myredissecret}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}

      # Features
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}

      # S3/Blob Storage (MinIO)
      LANGFUSE_USE_AZURE_BLOB: ${LANGFUSE_USE_AZURE_BLOB:-false}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-http://langfuse-minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://langfuse-minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BATCH_EXPORT_BUCKET:-langfuse}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: ${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_BATCH_EXPORT_REGION:-auto}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT:-http://langfuse-minio:9000}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT:-http://localhost:9002}
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID:-minioadmin}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: ${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE:-true}
    ports:
      - "127.0.0.1:3030:3030"
    networks:
      - myswiftagent
    restart: unless-stopped

  langfuse-server:
    image: langfuse/langfuse:3
    container_name: myswiftagent-langfuse-server
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env

      # Headless Initialization (自動セットアップ)
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-expertAgent}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-expertAgent-traces}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "3001:3000"  # Langfuse Web UI
    networks:
      - myswiftagent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  myswiftagent:
    driver: bridge
    name: myswiftagent-network
