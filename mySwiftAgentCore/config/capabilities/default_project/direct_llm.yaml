# Direct LLM Capability
# Migrated from expert_agent_capabilities.yaml

id: direct_llm
name: Direct LLM
description: 直接LLM呼び出し（システムプロンプト指定可能）- カスタムシステムプロンプトでLLM実行、複数モデル対応（GPT, Gemini, Ollama）
version: "1.0.0"
status: available
category: ai_agent
parameters:
  - name: user_input
    type: string
    required: true
    description: ユーザー入力メッセージ
  - name: system_prompt
    type: string
    required: false
    description: システムプロンプト
  - name: model
    type: string
    required: false
    description: 使用するLLMモデル
    defaultValue: "gpt-4o-mini"
    validation:
      enum:
        - gpt-4o-mini
        - gpt-4o
        - gemini-1.5-flash
        - gemini-1.5-pro
        - ollama/llama3
returnType: object
responseSchema:
  result:
    type: string
    description: LLMからの応答
tags:
  - ai
  - llm
  - gpt
  - gemini
  - ollama
examples:
  # TaskFlow形式でのcapability使用例
  - description: GPT-4o-miniでテキスト生成（TaskFlow）
    taskflow_step:
      id: "llm_call"
      type: "api_rest"
      config:
        capability_id: "direct_llm"
        method: "POST"
      params:
        body:
          user_input: "$input.prompt"
          model: "gpt-4o-mini"
    output_mapping:
      response: "$steps.llm_call.result"
  - description: カスタムシステムプロンプトで実行（TaskFlow）
    taskflow_step:
      id: "custom_llm"
      type: "api_rest"
      config:
        capability_id: "direct_llm"
        method: "POST"
      params:
        body:
          user_input: "$input.question"
          system_prompt: "$input.system_prompt"
          model: "gemini-1.5-flash"
    output_mapping:
      answer: "$steps.custom_llm.result"
metadata:
  author: MySwiftAgent Team
  created: "2024-01-15"
  use_cases:
    - カスタムシステムプロンプトでLLM実行
    - 複数モデル対応（GPT, Gemini, Ollama）
  models:
    - gpt-4o-mini（デフォルト）
    - gpt-4o
    - gemini-1.5-flash
    - gemini-1.5-pro
    - ollama/llama3

_internal:
  endpoint: /v1/mylllm
  method: POST
  auth_type: api_key
  timeout_ms: 60000
