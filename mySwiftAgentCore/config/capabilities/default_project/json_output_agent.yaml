# JSON Output Agent Capability
# Migrated from expert_agent_capabilities.yaml

id: json_output_agent
name: JSON Output Agent
description: 構造化JSON出力専用エージェント - 自然言語→JSON変換、常にJSON形式で返却、force_json不要（常にJSON）
version: "1.0.0"
status: available
category: ai_agent
parameters:
  - name: user_input
    type: string
    required: true
    description: ユーザー入力（自然言語またはJSON変換対象テキスト）
  - name: system_prompt
    type: string
    required: false
    description: システムプロンプト（JSON構造を指定）
  - name: model
    type: string
    required: false
    description: 使用するLLMモデル
    defaultValue: "gemini-2.5-flash"
returnType: object
responseSchema:
  result:
    type: object
    description: JSON形式の構造化出力
tags:
  - ai
  - agent
  - json
  - structured-output
examples:
  # TaskFlow形式でのcapability使用例
  - description: 自然言語からJSONに変換（TaskFlow）
    taskflow_step:
      id: "json_convert"
      type: "api_rest"
      config:
        capability_id: "json_output_agent"
        method: "POST"
      params:
        body:
          user_input: "$input.text"
          system_prompt: "入力をJSON形式に変換してください。{name, age, occupation}の形式で出力してください。"
    output_mapping:
      json_result: "$steps.json_convert.result"
  - description: テキスト解析してJSON出力（TaskFlow）
    taskflow_step:
      id: "text_analysis"
      type: "api_rest"
      config:
        capability_id: "json_output_agent"
        method: "POST"
      params:
        body:
          user_input: "$input.text"
          system_prompt: "$input.schema_instruction"
    output_mapping:
      structured_data: "$steps.text_analysis.result"
metadata:
  author: MySwiftAgent Team
  created: "2024-01-15"
  recommended_timeout: 90
  use_cases:
    - 自然言語→JSON変換
    - 常にJSON形式で返却
    - force_json不要（常にJSON）

_internal:
  endpoint: /v1/aiagent/utility/jsonoutput
  method: POST
  auth_type: api_key
  timeout_ms: 90000
