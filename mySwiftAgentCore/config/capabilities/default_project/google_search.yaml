# Google Search Capability
# Migrated from expert_agent_capabilities.yaml

id: google_search
name: Google検索
description: Web検索（Serper API使用）- LLMによるナレッジ抽出を含むため処理時間が長い。キーワード検索、複数クエリ一括検索対応
version: "1.0.0"
status: available
category: search
parameters:
  - name: queries
    type: array
    required: true
    description: 検索クエリのリスト
  - name: num
    type: number
    required: false
    description: 各クエリの検索結果件数
    defaultValue: 10
    validation:
      min: 1
      max: 100
returnType: object
responseSchema:
  search_results:
    type: array
    description: 検索結果のリスト（クエリごとに1つのオブジェクト）
    items:
      type: object
      properties:
        title:
          type: string
          description: 検索結果のタイトル
        link:
          type: string
          description: 検索結果のURL
        knowledge:
          type: string
          description: LLMが抽出したナレッジ情報
        original_query:
          type: string
          description: 元の検索クエリ
  search_results_count:
    type: integer
    description: 検索結果の件数
  status:
    type: string
    description: ステータス（通常 'ok'）
tags:
  - search
  - web
  - google
  - serper
  - knowledge-extraction
examples:
  # TaskFlow形式でのcapability使用例
  - description: 単一クエリ検索（TaskFlow）
    taskflow_step:
      id: "google_search"
      type: "api_rest"
      config:
        capability_id: "google_search"
        method: "POST"
      params:
        body:
          queries: ["$input.search_query"]
          num: 3
    output_mapping:
      search_results: "$steps.google_search.search_results"
      results_count: "$steps.google_search.search_results_count"
  - description: 複数クエリ一括検索（TaskFlow）
    taskflow_step:
      id: "multi_search"
      type: "api_rest"
      config:
        capability_id: "google_search"
        method: "POST"
      params:
        body:
          queries:
            - "$input.query1"
            - "$input.query2"
          num: 5
    output_mapping:
      all_results: "$steps.multi_search.search_results"
metadata:
  author: MySwiftAgent Team
  created: "2024-01-15"
  recommended_timeout: 180
  implementation: "Serper API経由でGoogle検索 + LLMナレッジ抽出"
  performance_note: "各検索結果に対してLLMでナレッジ抽出を行うため、num=3で約2分程度かかる場合がある"
  use_cases:
    - キーワード検索
    - 複数クエリ一括検索（queries配列）
    - 検索結果件数指定（num）
  workflow_usage_example: |
    # TaskFlow形式でのワークフロー使用例:
    {
      "workflow_name": "search_workflow",
      "steps": [
        {
          "id": "search",
          "type": "api_rest",
          "config": { "capability_id": "google_search", "method": "POST" },
          "params": { "body": { "queries": ["$input.query"], "num": 3 } }
        }
      ],
      "output": {
        "results": "$steps.search.search_results",
        "count": "$steps.search.search_results_count"
      }
    }
    # 結果参照パターン:
    # - 検索結果配列: $steps.search.search_results
    # - 結果件数: $steps.search.search_results_count
    # - 最初の結果のタイトル: $steps.search.search_results[0].title

_internal:
  endpoint: /v1/utility/google_search
  method: POST
  auth_type: api_key
  secret_key: SERPER_API_KEY
  timeout_ms: 180000
